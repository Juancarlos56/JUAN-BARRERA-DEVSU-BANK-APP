<section class="toasts" aria-live="polite" aria-label="Notificaciones">
  @for (notification of notificationService.notifications(); track notification.id) {
    <div
      class="toast"
      [class]="'toast--' + notification.type"
      [attr.role]="notification.type === 'error' ? 'alert' : 'status'"
    >
      <p class="toast__message">{{ notification.message }}</p>
      <button
        type="button"
        class="toast__close"
        aria-label="Cerrar notificación"
        (click)="notificationService.dismiss(notification.id)"
      >
        ×
      </button>
    </div>
  }
</section>
