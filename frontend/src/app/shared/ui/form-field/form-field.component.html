<div class="form-field" [class.form-field--disabled]="disabled()">
  <label class="form-field__label" [for]="controlId()">{{ label() }}</label>
  <ng-content />
  <p class="form-field__message" [id]="controlId() + '-message'" aria-live="polite">
    @if (error()) {
      <span class="form-field__error">{{ error() }}</span>
    } @else if (hint()) {
      <span class="form-field__hint">{{ hint() }}</span>
    }
  </p>
</div>
